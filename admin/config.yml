backend:
  name: git-gateway
  branch: main

media_folder: "photos/realisations"
public_folder: "/photos/realisations"

locale: fr

collections:
  - name: "photos"
    label: "Photos du site"
    files:

      - name: "chantiers"
        label: "① Galerie — mes chantiers"
        file: "content/realisations.json"
        format: "json"
        description: "Les photos qui s'affichent sur la page Réalisations. Ajoutez-en autant que vous voulez."
        fields:
          - name: "chantiers"
            label: "Chantiers"
            label_singular: "Chantier"
            widget: "list"
            summary: "{{fields.titre}} — {{fields.commune}}"
            fields:
              - { name: "photo", label: "Photo du chantier", widget: "image", required: true }
              - { name: "titre", label: "Titre", widget: "string", hint: "Ex. : Salon repeint en blanc velours" }
              - { name: "commune", label: "Commune", widget: "string", hint: "Ex. : Dax" }
              - name: "categorie"
                label: "Type de travaux"
                widget: "select"
                options:
                  - { label: "Intérieur", value: "int" }
                  - { label: "Façade & extérieur", value: "ext" }
                  - { label: "Décoration", value: "deco" }
                  - { label: "Rénovation", value: "reno" }

      - name: "avantapres"
        label: "② Avant / après"
        file: "content/avant-apres.json"
        format: "json"
        description: "Deux photos du MÊME endroit, prises du même point de vue. La première paire de la liste s'affiche sur le site."
        fields:
          - name: "paires"
            label: "Comparaisons avant / après"
            label_singular: "Comparaison"
            widget: "list"
            summary: "{{fields.titre}} — {{fields.commune}}"
            fields:
              - { name: "avant", label: "Photo AVANT les travaux", widget: "image", required: true }
              - { name: "apres", label: "Photo APRÈS les travaux", widget: "image", required: true }
              - { name: "titre", label: "Titre", widget: "string", hint: "Ex. : Salon rénové" }
              - { name: "commune", label: "Commune", widget: "string", hint: "Ex. : Mées" }

      - name: "identite"
        label: "③ Photos du site"
        file: "content/identite.json"
        format: "json"
        description: "Les grandes photos fixes du site. Une seule fois, puis vous n'y touchez plus."
        fields:
          - { name: "hero", label: "Grande photo d'accueil (format vertical)", widget: "image", required: false, hint: "En haut de la page d'accueil, à droite du titre. Un beau chantier fini." }
          - { name: "ambiance", label: "Photo d'ambiance (format paysage)", widget: "image", required: false, hint: "Au milieu de la page d'accueil. Vous ou un compagnon en train de peindre." }
          - { name: "portrait", label: "Portrait du fondateur (format vertical)", widget: "image", required: false, hint: "Page À propos. Ousmane en tenue de travail, sur un chantier." }
